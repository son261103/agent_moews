[project]
name = "agent-moew-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "deepagents",
    "langchain-tavily",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "tenacity",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pyrefly",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyrefly]
preset = "basic"
project-includes = ["src", "tests"]
search-path = ["."]
python-version = "3.12"
python-interpreter-path = ".venv/bin/python"
site-package-path = [".venv/lib/python3.12/site-packages"]
